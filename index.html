            const getSystemTheme = () =>
                window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light";

            let style; // Active theme, assigned by setTheme

            function setTheme(mode) {
                const actualTheme = mode === "system" ? getSystemTheme() : mode;
                style = themes[actualTheme];

                // Update CSS custom properties for CSS elements
                const root = document.documentElement;
                root.style.setProperty(
                    "--background",
                    style.interface.backgroundColor,
                );
                root.style.setProperty(
                    "--foreground",
                    style.interface.foregroundColor,
                );
                root.style.setProperty("--text", style.interface.textColor);
                root.style.setProperty("--header", style.interface.headerColor);

                // Theme scroll bars
                document.documentElement.style.colorScheme = actualTheme;
            }

            // Initialize
            setTheme("system");

            // Listen for system theme changes
            window
                .matchMedia("(prefers-color-scheme: dark)")
                .addEventListener("change", () => {
                    const themeSelect = document.getElementById("theme-select");
                    if (themeSelect && themeSelect.value === "system") {
                        setTheme("system");
                    }
                });

            function resizeCanvas() {
                // Increase the size of the canvas
                canvas.width = window.innerWidth * window.devicePixelRatio;
                canvas.height = window.innerHeight * window.devicePixelRatio;

                if (DEBUG) {
                    console.log("Device Pixel Ratio:", window.devicePixelRatio);
                    console.log("window.innerHeight", window.innerHeight);
                }

                // Scale drawing operations
                context.scale(devicePixelRatio, devicePixelRatio);
                context.lineWidth = 2;

                // scale everything down using CSS
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }

            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);

            // Set the center of the viewport
            function setViewportFrequency(viewportFrequency) {
                offset.x =
                    canvas.width / window.devicePixelRatio / 2 -
                    viewportFrequency * 2 * scale;
            }

            function setViewportFrequencyRange(startFrequency, stopFrequency) {
                // Calculate the width of the viewport in pixels (accounting for device pixel ratio)
                const viewportWidth = canvas.width / window.devicePixelRatio;

                // Calculate required scale to fit the frequency range in the viewport
                // The 2 comes from the base scale factor in mhzToScreenX where pixelsPerMhz = 2 * scale
                scale = viewportWidth / ((stopFrequency - startFrequency) * 2);

                // Clamp the scale to min/max zoom levels
                scale = Math.min(Math.max(minZoom, scale), maxZoom);

                // Calculate the offset needed to position startFrequency at the left edge
                offset.x = -startFrequency * 2 * scale;
            }

            setViewportFrequencyRange(2395, 2505);

            // Common drawing utilities
            function getBaselineY() {
                return canvas.height / window.devicePixelRatio / 2;
            }

            function getZoomTier(scale) {
                return Object.values(zoomTiers).find(
                    (tier) => scale < tier.threshold,
                );
            }

            function drawFrequencyMarkers(
                context,
                scale,
                viewportStart,
                viewportEnd,
            ) {
                const tier = getZoomTier(scale);
                const config = tier.frequency;
                const baselineY = getBaselineY();

                viewportStart = Math.max(
                    0,
                    Math.min(MAX_FREQUENCY_MHZ, viewportStart),
                );
                viewportEnd = Math.max(
                    0,
                    Math.min(MAX_FREQUENCY_MHZ, viewportEnd),
                );

                const startFreq =
                    Math.floor(viewportStart / config.step) * config.step;
                const endFreq =
                    Math.ceil(viewportEnd / config.step) * config.step;

                context.beginPath();
                context.strokeStyle = style.interface.textColor;
                context.fillStyle = style.interface.textColor;
                context.textAlign = "center";

                for (
                    let freq = startFreq;
                    freq <= endFreq;
                    freq += config.step
                ) {
                    if (freq >= 0 && freq <= MAX_FREQUENCY_MHZ) {
                        const x = mhzToScreenX(freq);

                        // Draw tick mark
                        context.moveTo(x, baselineY);
                        context.lineTo(x, baselineY + 10);

                        // Draw frequency label using the label system
                        const label = config.showAsGHz
                            ? `${(freq / 1000).toFixed(config.ghzDecimals)} GHz`
                            : `${freq} MHz`;

                        // Draw the marker labels
                        const freqMarkerY = baselineY + 20; // Apply 20px offset to label
                        context.fillStyle = style.interface.textColor;
                        context.fillText(label, x, freqMarkerY);

                        // Draw minor ticks
                        for (
                            let minorFreq = freq + config.minorSteps;
                            minorFreq < freq + config.step &&
                            minorFreq <= MAX_FREQUENCY_MHZ;
                            minorFreq += config.minorSteps
                        ) {
                            if (minorFreq >= 0) {
                                const minorX = mhzToScreenX(minorFreq);
                                context.moveTo(minorX, baselineY);
                                context.lineTo(minorX, baselineY + 5);
                            }
                        }
                    }
                }
                context.stroke();
            }

            function drawSubcarriers({
                centerX,
                centerY,
                channelType,
                scale,
                height,
                color,
                fillColor,
                points = 24,
            }) {
                const config = wifiSubcarriers[channelType];
                const subCarrierWidth = config.spacing / 1000;
                const width = subCarrierWidth * 2 * scale;

                const isInRanges = (index, ranges) => {
                    if (!ranges) return false;
                    return ranges.some((range) => {
                        if (Array.isArray(range)) {
                            return index >= range[0] && index <= range[1];
                        }
                        return index === range;
                    });
                };

                const getMaxIndex = () => {
                    let max = 0;
                    config.subcarriers.forEach((range) => {
                        max = Math.max(
                            max,
                            Array.isArray(range) ? range[1] : range,
                        );
                    });
                    return max;
                };

                const maxIndex = getMaxIndex();

                // Draw data subcarrier fills
                context.beginPath();
                context.fillStyle = fillColor;

                let currentX = centerX;
                for (let i = 0; i <= maxIndex; i++) {
                    if (
                        isInRanges(i, config.subcarriers) &&
                        !isInRanges(i, config.nulls) &&
                        !isInRanges(i, config.pilots)
                    ) {
                        context.moveTo(currentX - width / 2, centerY);
                        for (let j = 0; j <= points; j++) {
                            const px = (j / points) * width - width / 2;
                            const py =
                                height * (1 - Math.pow((2 * px) / width, 2));
                            context.lineTo(currentX + px, centerY - py);
                        }
                        context.lineTo(currentX + width / 2, centerY);
                    }
                    currentX += width;
                }

                currentX = centerX;
                for (let i = 0; i <= maxIndex; i++) {
                    if (
                        isInRanges(i, config.subcarriers) &&
                        !isInRanges(i, config.nulls) &&
                        !isInRanges(i, config.pilots)
                    ) {
                        context.moveTo(currentX - width / 2, centerY);
                        for (let j = 0; j <= points; j++) {
                            const px = (j / points) * width - width / 2;
                            const py =
                                height * (1 - Math.pow((2 * px) / width, 2));
                            context.lineTo(currentX + px, centerY - py);
                        }
                        context.lineTo(currentX + width / 2, centerY);
                    }
                    currentX -= width;
                }

                context.fill();

                // Draw pilot fills
                context.beginPath();
                context.fillStyle = color;

                currentX = centerX;
                for (let i = 0; i <= maxIndex; i++) {
                    if (isInRanges(i, config.pilots)) {
                        context.moveTo(currentX - width / 2, centerY);
                        for (let j = 0; j <= points; j++) {
                            const px = (j / points) * width - width / 2;
                            const py =
                                height * (1 - Math.pow((2 * px) / width, 2));
                            context.lineTo(currentX + px, centerY - py);
                        }
                        context.lineTo(currentX + width / 2, centerY);
                    }
                    currentX += width;
                }

                currentX = centerX;
                for (let i = 0; i <= maxIndex; i++) {
                    if (isInRanges(i, config.pilots)) {
                        context.moveTo(currentX - width / 2, centerY);
                        for (let j = 0; j <= points; j++) {
                            const px = (j / points) * width - width / 2;
                            const py =
                                height * (1 - Math.pow((2 * px) / width, 2));
                            context.lineTo(currentX + px, centerY - py);
                        }
                        context.lineTo(currentX + width / 2, centerY);
                    }
                    currentX -= width;
                }

                context.fill();

                // Draw all strokes
                context.beginPath();
                context.strokeStyle = color;

                currentX = centerX;
                for (let i = 0; i <= maxIndex; i++) {
                    if (
                        isInRanges(i, config.subcarriers) &&
                        !isInRanges(i, config.nulls)
                    ) {
                        for (let j = 0; j <= points; j++) {
                            const px = (j / points) * width - width / 2;
                            const py =
                                height * (1 - Math.pow((2 * px) / width, 2));
                            if (j === 0) {
                                context.moveTo(currentX + px, centerY - py);
                            } else {
                                context.lineTo(currentX + px, centerY - py);
                            }
                        }
                    }
                    currentX += width;
                }

                currentX = centerX;
                for (let i = 0; i <= maxIndex; i++) {
                    if (
                        isInRanges(i, config.subcarriers) &&
                        !isInRanges(i, config.nulls)
                    ) {
                        for (let j = 0; j <= points; j++) {
                            const px = (j / points) * width - width / 2;
                            const py =
                                height * (1 - Math.pow((2 * px) / width, 2));
                            if (j === 0) {
                                context.moveTo(currentX + px, centerY - py);
                            } else {
                                context.lineTo(currentX + px, centerY - py);
                            }
                        }
                    }
                    currentX -= width;
                }

                context.stroke();
            }

            // True when DSSS is the channel's only modulation (e.g. 2.4 GHz
            // channel 14), which is drawn as a parabola instead of a ziggurat
            function isDsssOnly(channel) {
                return (
                    channel.modulation?.length === 1 &&
                    channel.modulation[0] === "DSSS"

            }

                // Draw subcarriers for OFDM
                if (

                }

                // Draw subcarriers for HT
                if (
                    showSubcarriers &&
                    subCarrierMode == "HT" &&
                    scale >= 9 &&
                    !isDsssOnly(channel) &&
                    channel.modulation?.includes("HT")
                ) {
                    switch (channel.width) {
                        case 20:
                            drawSubcarriers({
                                centerX: mhzToScreenX(channel.frequency),
                                centerY: getBaselineY(),
                                channelType: "HT-20",

                                color: style.wifi.primaryColor,
                                fillColor: style.wifi.secondaryColor,
                            });
                            channelType = "HT-20";
                            break;
                        case 40:
                            drawSubcarriers({
                                centerX: mhzToScreenX(channel.frequency),
                                centerY: getBaselineY(),
                                channelType: "HT-40",
                                scale: scale,
                                height: chartSettings.spectralMaskHeight - 2,
                                color: style.wifi.primaryColor,
                                fillColor: style.wifi.secondaryColor,
                            });
                            channelType = "HT-40";
                            break;
                        default:
                            break;
                    }
                }

                // Draw subcarriers for VHT
                if (
                    showSubcarriers &&
                    subCarrierMode == "VHT" &&
                    scale >= 9 &&
                    !isDsssOnly(channel) &&
                    channel.modulation?.includes("VHT")
                ) {
                    switch (channel.width) {
                        case 20:
                            drawSubcarriers({
                                centerX: mhzToScreenX(channel.frequency),
                                centerY: getBaselineY(),
                                channelType: "VHT-20",
                                scale: scale,
                                height: chartSettings.spectralMaskHeight - 2,
                                color: primaryColor,
                                fillColor: secondaryColor,
                            });
                            channelType = "VHT-20";
                            break;
                        case 40:
                            drawSubcarriers({
                                centerX: mhzToScreenX(channel.frequency),
                                centerY: getBaselineY(),
                                channelType: "VHT-40",
                                scale: scale,
                                height: chartSettings.spectralMaskHeight - 2,
                                color: style.wifi.primaryColor,
                                fillColor: style.wifi.secondaryColor,
                            });
                            channelType = "VHT-40";
                            break;
                        case 80:
                            drawSubcarriers({
                                centerX: mhzToScreenX(channel.frequency),
                                centerY: getBaselineY(),
                                channelType: "VHT-80",
                                scale: scale,
                                height: chartSettings.spectralMaskHeight - 2,
                                color: style.wifi.primaryColor,
                                fillColor: style.wifi.secondaryColor,
                            });
                            channelType = "VHT-80";
                            break;
                        case 160:
                            drawSubcarriers({
                                centerX: mhzToScreenX(channel.frequency),
                                centerY: getBaselineY(),
                                channelType: "VHT-160",

                                fillColor: style.wifi.secondaryColor,
                            });

                            break;
                        default:
                            break;
                    }
                }

                // Use parabola for DSSS-only channels, ziggurat for others
                if (isDsssOnly(channel)) {
                    drawParabola(
                        centerX,
                        centerY,
                        width,
                        height,
                        style.wifi.primaryColor,
                        style.wifi.secondaryColor,
                    );
                } else {
                    drawZiggurat(
                        centerX,
                        centerY,
                        width,
                        height,
                        channelType,
                        primaryColor,

                // Create the rowData object
                const rowData = {
                    id: "wi-fi",
                    type: widthForID,
                };

                drawChannelLabel(
                    centerX,
                    centerY,
                    width,
                    primaryColor,

            }

            function drawZiggurat(
                centerX,
                centerY,
                width,
                height,
                channelType,
                lineColor,
                fillColor,
            ) {
                const channelWidthMhz = width / (2 * scale);
                let mhzInset;

                if (wifiSubcarriers[channelType]) {
                    mhzInset = wifiSubcarriers[channelType].inset;
                } else if (channelWidthMhz <= 16) {
                    mhzInset = 0.09375;
                } else {
                    mhzInset = 1.875;
                }

                const insetPixels = mhzInset * 2 * scale;
                const lowerFreqX = centerX - width / 2 + insetPixels;
                const upperFreqX = centerX + width / 2 - insetPixels;
                const topY = centerY - height;

                // Draw fill first
                context.beginPath();
                context.moveTo(centerX - width / 2, centerY); // Full channel start
                context.lineTo(lowerFreqX, topY); // Inset start
                context.lineTo(upperFreqX, topY); // Inset end
                context.lineTo(centerX + width / 2, centerY); // Full channel end
                context.fillStyle = fillColor;
                context.fill();

                // Draw outline (without bottom line)
                context.beginPath();
                context.strokeStyle = lineColor;
                context.moveTo(lowerFreqX, topY);
                context.lineTo(centerX - width / 2, centerY);
                context.moveTo(upperFreqX, topY);
                context.lineTo(centerX + width / 2, centerY);
                context.moveTo(lowerFreqX, topY);
                context.lineTo(upperFreqX, topY);
                context.stroke();
            }

            function drawParabola(
                centerX,
                centerY,
                width,
                height,
                lineColor,
                fillColor,
            ) {
                var points = 24;

                // Draw fill first
                context.beginPath();
                context.moveTo(centerX - width / 2, centerY); // Start at bottom left

                // Draw parabola points
                for (let i = 0; i <= points; i++) {
                    const x = (i / points) * width - width / 2;
                    const y = height * (1 - Math.pow((2 * x) / width, 2));
                    context.lineTo(centerX + x, centerY - y);
                }

                context.lineTo(centerX + width / 2, centerY); // To bottom right
                context.fillStyle = fillColor;
                context.fill();

                // Draw outline (without bottom line)
                context.beginPath();
                context.strokeStyle = lineColor;
                // Draw parabola curve only
                for (let i = 0; i <= points; i++) {
                    const x = (i / points) * width - width / 2;
                    const y = height * (1 - Math.pow((2 * x) / width, 2));
                    if (i === 0) {
                        context.moveTo(centerX + x, centerY - y);
                    } else {
                        context.lineTo(centerX + x, centerY - y);
                    }
                }
                context.stroke();
            }

            // Country code filtering
            function filterByCountry(domain) {
                if (domain.includes("WW") && showWWDomain) {
                    return true;
                }
                if (domain.includes("US") && showUSDomain) {
                    return true;
                }
                if (domain.includes("EU") && showEUDomain) {
                    return true;
                }
                if (domain.includes("JP") && showJPDomain) {
                    return true;
                }
                if (domain.includes("AU") && showAUDomain) {
                    return true;
                } else {
                    return false;
                }
            }

            // Helper function for coordinate conversion
            function mhzToScreenX(mhz) {
                const pixelsPerMhz = 2 * scale;
                return mhz * pixelsPerMhz + offset.x;
            }

            // Helper function for coordinate conversion
            function screenXToMhz(screenX) {
                const pixelsPerMhz = 2 * scale;
                const freq = (screenX - offset.x) / pixelsPerMhz;
                return Math.max(0, Math.min(MAX_FREQUENCY_MHZ, freq));
            }

            // Check if a new channel label overlaps with existing ones
            function findRowForChannelLabel(labelStart, labelWidth) {
                const labelEnd = labelStart + labelWidth;
                let row = 0;

                // Keep checking rows until we find one where the label fits
                while (true) {
                    // Get all labels in current row
                    const labelsInRow = channelLabelPositions.filter(
                        (label) => label.row === row,
                    );

                    // Check if label overlaps with any existing labels in this row
                    const hasOverlap = labelsInRow.some(
                        (existingLabel) =>
                            !(
                                labelEnd < existingLabel.start ||
                                labelStart > existingLabel.end
                            ),
                    );

                    if (!hasOverlap) {
                        // Found a row where the label fits! Add it to our positions
                        channelLabelPositions.push({
                            row,
                            start: labelStart,
                            end: labelEnd,
                        });
                        return row;
                    }

                    // Try next row
                    row++;
                }
            }

            // Check if a new band label overlaps with existing ones
            function findRowForBandLabel(labelStart, labelEnd) {
                let row = 0;

                // Keep checking rows until we find one where the label fits
                while (true) {
                    // Get all labels in current row
                    const labelsInRow = bandLabelPositions.filter(
                        (label) => label.row === row,
                    );

                    // Check if label overlaps with any existing labels in this row
                    const hasOverlap = labelsInRow.some(
                        (existingLabel) =>
                            !(
                                labelEnd < existingLabel.start ||
                                labelStart > existingLabel.end
                            ),
                    );

                    if (!hasOverlap) {
                        // Found a row where the label fits! Add it to our positions
                        bandLabelPositions.push({
                            row,
                            start: labelStart,
                            end: labelEnd,
                        });
                        return row;
                    }

                    // Try next row
                    row++;
                }
            }

            function drawChannelLabel(
                centerX,
                centerY,
                width,
                backgroundColor,
                foregroundColor,
                text,
                channel,
            ) {
                // If the label is too narrow, don't draw it
                if (width < 4) return;

                // Calculate label position
                const labelStart = centerX - width / 2;

                // Find which row this label should go in
                const row = findRowForChannelLabel(labelStart, width - 2);

                // Calculate vertical offset based on row
                const rowOffset = BASE_OFFSET - row * ROW_HEIGHT;

                // Draw the label
                const height = 30;
                centerY = centerY - rowOffset;

                const labelBottom = centerY - height / 2 + LABEL_HEIGHT;
                contentBounds.bottom = Math.max(
                    contentBounds.bottom,
                    labelBottom,
                );

                context.beginPath();
                context.roundRect(
                    centerX - width / 2,
                    centerY - height / 2,
                    width - 2,
                    LABEL_HEIGHT,
                    6,
                );
                context.fillStyle = backgroundColor;
                context.fill();

                // Remember where this label is, for mouseover hit testing
                labelHitBoxes.push({
                    x: centerX - width / 2,
                    y: centerY - height / 2,
                    width: width - 2,
                    height: LABEL_HEIGHT,
                    hoverColor: lightenColor(backgroundColor, 0.7),
                    text,
                    textX: centerX,
                    textY: centerY,
                    fitWidth: width,
                    rows: () => describeChannel(channel),
                });

                // Stop-gap, temporary fix
                context.font = "14px Quicksand";
                context.textAlign = "center";
                context.textBaseline = "middle";

                // Draw text if it fits
                const textWidth = context.measureText(text).width + 4;
                if (width >= textWidth) {
                    context.fillStyle = foregroundColor;
                    context.fillText(text, centerX, centerY);
                }
            }

            function drawBandLabel(
                startX,
                centerX,
                centerY,
                width,
                primaryColor,
                secondaryColor,
                textColor,
                text,
                band,
            ) {
                contentBounds.top = Math.min(contentBounds.top, centerY);

                labelHitBoxes.push({
                    x: startX,
                    y: centerY,
                    width,
                    height: LABEL_HEIGHT,
                    hoverColor: secondaryColor,
                    text,
                    textX: centerX,
                    textY: centerY + LABEL_HEIGHT / 2,
                    fitWidth: width,
                    rows: () => describeBand(band),
                });

                // Draw rectangle
                context.beginPath();
                context.roundRect(startX, centerY, width, LABEL_HEIGHT, 6);
                context.fillStyle = primaryColor;
                context.fill();

                // Calculate the text width and add padding
                const textWidth = context.measureText(text).width + 4;

                if (width >= textWidth) {
                    context.fillStyle = textColor;
                    context.fillText(text, centerX, centerY + LABEL_HEIGHT / 2);
                } else {
                }
            }

            // Pan vertically by deltaY, without moving further out of range.
            // The range is the same in both directions: enough to bring the
            // side that overflows the viewport fully into view. If nothing
            // overflows, there is no range and the chart stays centered.
            // Moving back toward the range is always allowed, so a change in
            // the content (zooming, filters) never strands the view.
            function panVertically(deltaY) {
                const baselineY = getBaselineY();
                const above = baselineY - contentBounds.top;
                const below = contentBounds.bottom - baselineY;
                const range = Math.max(
                    0,
                    Math.max(above, below) + VERTICAL_PADDING - baselineY,
                );

                // Don't pass the range, unless we're already outside of it
                const upperLimit = Math.max(range, offset.y);
                const lowerLimit = Math.min(-range, offset.y);

                const next = offset.y + deltaY;
                offset.y = Math.min(Math.max(next, lowerLimit), upperLimit);
            }

            // Keep either end of the chart from passing the viewport's center.
            // Unlike vertical panning, this is clamped every frame: the limits
            // depend only on the scale, never on which labels are visible.
            function clampHorizontalOffset() {
                const centerX = canvas.width / window.devicePixelRatio / 2;
                const pixelsPerMhz = 2 * scale;
                const maxOffset = centerX; // 0 MHz at the center
                // Last MHz at the center
                const minOffset = centerX - MAX_FREQUENCY_MHZ * pixelsPerMhz;
                offset.x = Math.min(Math.max(offset.x, minOffset), maxOffset);
            }

            // Mix a CSS rgb()/rgba() color toward white. amount: 0 = unchanged,
            // 1 = white. The result is always opaque.
            function lightenColor(color, amount) {
                const [r, g, b] = color.match(/[\d.]+/g).slice(0, 3).map(Number);
                const mix = (c) => Math.round(c + (255 - c) * amount);
                return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
            }

            // Format a frequency value with up to 3 decimals, e.g. "2437 MHz"
            function formatMhz(value) {
                return `${Number(value.toFixed(3))} MHz`;
            }

            // [label, value] pairs for a channel's tooltip
            function describeChannel(channel) {
                const rows = [["Channel", channel.channel]];

                if (channel.frequency !== undefined && channel.width !== undefined) {
                    rows.push(
                        ["Center", formatMhz(channel.frequency)],
                        ["Start", formatMhz(channel.frequency - channel.width / 2)],
                        ["Stop", formatMhz(channel.frequency + channel.width / 2)],
                        ["Width", formatMhz(channel.width)],
                    );
                }

                // Any other attributes (domain, psc, advertising, ...)
                const shown = ["channel", "frequency", "width"];
                Object.entries(channel).forEach(([key, value]) => {
                    if (shown.includes(key)) return;
                    const name = key.charAt(0).toUpperCase() + key.slice(1);
                    rows.push([name, Array.isArray(value) ? value.join(", ") : value]);
                });

                return rows;
            }

            // [label, value] pairs for a band's tooltip
            function describeBand(band) {
                const rows = [
                    ["Band", band.name],
                    ["Center", formatMhz((band.start + band.stop) / 2)],
                    ["Start", formatMhz(band.start)],
                    ["Stop", formatMhz(band.stop)],
                    ["Width", formatMhz(band.stop - band.start)],
                ];

                // Any other attributes
                const shown = ["name", "start", "stop"];
                Object.entries(band).forEach(([key, value]) => {
                    if (shown.includes(key)) return;
                    const name = key.charAt(0).toUpperCase() + key.slice(1);
                    rows.push([name, Array.isArray(value) ? value.join(", ") : value]);
                });

                return rows;
            }

            // Place a tooltip near the pointer (screen coordinates), flipping to
            // the other side of the pointer and clamping so it stays fully
            // inside the viewport.
            function placeTooltip(pointerX, pointerY, width, height, fromTouch) {
                const GAP = 14;
                const viewportWidth = canvas.width / window.devicePixelRatio;
                const viewportHeight = canvas.height / window.devicePixelRatio;

                let x = pointerX + GAP;
                if (x + width > viewportWidth) x = pointerX - GAP - width;

                // A finger covers what is below it, so touch prefers above
                const gapY = fromTouch ? GAP * 3 : GAP;
                let y = fromTouch ? pointerY - gapY - height : pointerY + gapY;
                if (fromTouch && y < 0) y = pointerY + gapY;
                else if (!fromTouch && y + height > viewportHeight)
                    y = pointerY - gapY - height;

                return {
                    x: Math.max(0, Math.min(x, viewportWidth - width)),
                    y: Math.max(0, Math.min(y, viewportHeight - height)),
                };
            }

            // Lighten the channel or band label under the pointer and show all of its
            // attributes as plain text. Called inside the offset.y translate.
            function drawHoveredLabel() {
                if (!inspectPosition || isDragging) return;

                const x = inspectPosition.x;
                const y = inspectPosition.y - offset.y;

                const tolerance = inspectFromTouch ? TOUCH_HIT_TOLERANCE : 0;

                // Later labels are drawn on top, so search from the end
                const hit = [...labelHitBoxes]
                    .reverse()
                    .find(
                        (box) =>
                            x >= box.x - tolerance &&
                            x <= box.x + box.width + tolerance &&
                            y >= box.y - tolerance &&
                            y <= box.y + box.height + tolerance,
                    );
                if (!hit) return;

                // Repaint the label box in a lighter tint of its own color
                context.beginPath();
                context.roundRect(hit.x, hit.y, hit.width, hit.height, 6);
                context.fillStyle = hit.hoverColor;
                context.fill();

                context.font = "14px Quicksand";
                context.textAlign = "center";
                context.textBaseline = "middle";
                if (hit.fitWidth >= context.measureText(hit.text).width + 4) {
                    context.fillStyle = "#000000";
                    context.fillText(hit.text, hit.textX, hit.textY);
                }

                const lines = hit.rows();

                const lineHeight = 18;
                const padding = 8;
                context.font = "14px Quicksand";
                context.textAlign = "left";
                context.textBaseline = "middle";
                const BOLD_FONT = "bold 14px Quicksand";
                const REGULAR_FONT = "14px Quicksand";

                // Each row is a bold "Label:" followed by a regular value
                const rowWidths = lines.map(([label, value]) => {
                    context.font = BOLD_FONT;
                    const labelWidth = context.measureText(`${label}:`).width;
                    context.font = REGULAR_FONT;
                    const valueWidth = context.measureText(` ${value}`).width;
                    return { labelWidth, total: labelWidth + valueWidth };
                });
                const boxWidth =
                    Math.max(...rowWidths.map((r) => r.total)) + padding * 2;
                const boxHeight = lines.length * lineHeight + padding * 2;

                const { x: boxX, y: boxY } = placeTooltip(
                    inspectPosition.x,
                    inspectPosition.y,
                    boxWidth,
                    boxHeight,
                    inspectFromTouch,
                );

                context.beginPath();
                context.roundRect(boxX, boxY - offset.y, boxWidth, boxHeight, 6);
                context.fillStyle = "#000000";
                context.fill();

                context.fillStyle = "#ffffff";
                lines.forEach(([label, value], i) => {
                    const rowY = boxY - offset.y + padding + lineHeight * (i + 0.5);
                    context.font = BOLD_FONT;
                    context.fillText(`${label}:`, boxX + padding, rowY);
                    context.font = REGULAR_FONT;
                    context.fillText(
                        ` ${value}`,
                        boxX + padding + rowWidths[i].labelWidth,
                        rowY,
                    );
                });

                // Restore the text style the rest of draw() relies on
                context.font = "14px Quicksand";
                context.textAlign = "center";
            }

            function draw() {
                // Clear the canvas and label positions
                context.clearRect(0, 0, canvas.width, canvas.height);

                // Clamp before drawing, so input that overshoots is never rendered
                clampHorizontalOffset();

                // Reset the content bounds to the baseline area
                const baselineY = getBaselineY();
                const maskTop = baselineY - chartSettings.spectralMaskHeight;
                contentBounds.top = maskTop;
                contentBounds.bottom = baselineY + FREQUENCY_MARKER_DEPTH;

                // Everything below scrolls vertically with offset.y
                context.save();
                context.translate(0, offset.y);

                // Text style for everything drawn below. Band labels and frequency
                // markers don't set their own, so don't rely on leftover state.
                context.font = "14px Quicksand";
                context.textAlign = "center";
                context.textBaseline = "middle";

                channelLabelPositions.length = 0;
                labelHitBoxes.length = 0;
                bandLabelPositions.length = 0;

                // Draw WiFi channels
                if (showWifi) {
                    ["900 MHz", "2.4 GHz", "5 GHz", "6 GHz"].forEach((band) => {
                        wifiChannels[band].forEach((channel) => {
                            // Filter overlapping channels in 2.4 GHz
                            if (
                                band === "2.4 GHz" &&
                                channel.overlapping &&
                                !showOverlapping
                            ) {
                                return;
                            }

                            if (!showUNII4 && channel.attributes == "UNII-4") {
                                return;
                            }

                            // Filter by channel width
                            if (
                                (channel.width === 1 && !show1MHz) ||
                                (channel.width === 2 && !show2MHz) ||
                                (channel.width === 4 && !show4MHz) ||
                                (channel.width === 8 && !show8MHz) ||
                                (channel.width === 16 && !show16MHz) ||
                                (channel.width === 20 && !show20MHz) ||
                                (channel.width === 40 && !show40MHz) ||
                                (channel.width === 80 && !show80MHz) ||
                                (channel.width === 160 && !show160MHz) ||
                                (channel.width === 320 && !show320MHz)
                            ) {
                                return;
                            }

                            if (filterByCountry(channel.domain)) {
                                drawWiFiChannel(channel, scale, channel.width);
                            } else {
                                return;
                            }
                        });
                    });
                }

                // Draw Bluetooth channels
                if (showBluetooth) {
                    bluetoothChannels[bluetoothMode].forEach((channel) => {
                        drawBluetoothChannel(channel, scale);
                    });
                }

                // Draw Zigbee channels
                if (showZigbee) {
                    Object.keys(zigbeeChannels).forEach((band) => {
                        zigbeeChannels[band].forEach((channel) => {
                            if (filterByCountry(channel.domain)) {
                                drawZigbeeChannel(channel, scale);
                            } else {
                                return;
                            }
                        });
                    });
                }

                if (showLoRa) {
                    Object.keys(loRaChannels).forEach((band) => {
                        loRaChannels[band].forEach((channel) => {
                            // Filter by channel width
                            if (
                                (channel.width === 0.125 && !showLoRa125) ||
                                (channel.width === 0.5 && !showLoRa500)
                            ) {
                                return;
                            }

                            if (filterByCountry(channel.domain)) {
                                drawLoRaChannel(channel, scale, channel.width);
                            } else {
                                return;
                            }
                        });
                    });
                }

                // Draw band labels
                Object.keys(bands).forEach((bandType) => {
                    bands[bandType].forEach((band) => {
                        // Filter by band type
                        if (bandType == "fcc" && !showBandFCC) {
                            return;
                        }

                        if (bandType == "etsi" && !showBandETSI) {
                            return;
                        }

                        if (bandType == "gsm" && !showBandCellularGSM) {
                            return;
                        }

                        if (bandType == "nr" && !showBandCellular5GNR) {
                            return;
                        }

                        if (bandType == "lte" && !showBandCellularLTE) {
                            return;
                        }

                        if (bandType == "itu" && !showBandITU) {
                            return;
                        }

                        const startX = mhzToScreenX(band.start);
                        const stopX = mhzToScreenX(band.stop);

                        const width = stopX - startX - 4;
                        if (width < 4) return;
                        const centerX = startX + width / 2;

                        // Find which row this label should go in
                        const row = findRowForBandLabel(startX + 1, stopX - 1);

                        // Calculate vertical offset based on row
                        const centerY =
                            getBaselineY() -
                            chartSettings.spectralMaskHeight -
                            BAND_LABEL_OFFSET -
                            row * ROW_HEIGHT;

                        drawBandLabel(
                            startX,
                            centerX,
                            centerY,
                            width,
                            style[bandType].primaryColor,
                            style[bandType].secondaryColor,
                            style[bandType].textColor,
                            band.name,
                            band,
                        );
                    });
                });

                // Draw DECT channels
                if (showDect) {
                    dectChannels.forEach((channel) => {
                        if (filterByCountry(channel.domain)) {
                            drawDectChannel(channel, scale);
                        } else {
                            return;
                        }
                    });
                }

                // Draw UWB channels
                if (showUwb) {
                    uwbChannels.forEach((channel) => {
                        if (channel.width > 500 && !showUwb500MHz) {
                            return;
                        }

                        if (channel.width < 1000 && !showUwb1000MHz) {
                            return;
                        }

                        drawUwbChannel(channel, scale);
                    });
                }

                // Draw baseline
                context.beginPath();
                const startX = mhzToScreenX(0);
                const endX = mhzToScreenX(MAX_FREQUENCY_MHZ);
                context.moveTo(startX, baselineY);
                context.lineTo(endX, baselineY);
                context.strokeStyle = style.interface.textColor;
                context.lineWidth = 2;
                context.stroke();

                // Draw frequency markers
                drawFrequencyMarkers(
                    context,
                    scale,
                    screenXToMhz(0),
                    screenXToMhz(canvas.width),
                );

                drawHoveredLabel();

                context.restore();

                requestAnimationFrame(draw);
            }

            // Mouse events for panning
            canvas.addEventListener("mousedown", (e) => {

                lastPosition = { x: e.clientX, y: e.clientY };

            // Hover tracking. Pointer events say what kind of device it was, so

            function coastingAnimation() {
                if (!isCoasting) return;

                // Apply friction
                const friction = 0.97; // Closer to 1 means more coasting
                velocity *= friction;

                // Update offset based on velocity
                offset.x += velocity * 16; // Assuming 60 fps (16ms per frame)

                // Stop coasting when velocity is very low
                if (Math.abs(velocity) < 0.01) {
                    isCoasting = false;
                    return;

                requestAnimationFrame(coastingAnimation);

            // Mouse wheel zooming
            canvas.addEventListener("wheel", (e) => {
                e.preventDefault();
                inspectPosition = null;

                const currentTime = Date.now();

                // Reset direction lock if enough time has passed
                if (currentTime - lastWheelTime > wheelTimeout) {
                    scrollDirection = null;
                }
                lastWheelTime = currentTime;

                // Determine scroll direction if not already locked
                if (!scrollDirection) {
                    if (
                        Math.abs(e.deltaX) >
                        Math.abs(e.deltaY) * scrollThreshold
                    ) {
                        scrollDirection = "horizontal";
                    } else if (
                        Math.abs(e.deltaY) >
                        Math.abs(e.deltaX) * scrollThreshold
                    ) {
                        scrollDirection = "vertical";
                    } else {
                        // If no clear direction yet, exit early
                        return;
                    }
                }

                // Handle scrolling based on locked direction
                if (scrollDirection === "vertical") {
                    // Zoom logic
                    const rect = canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const centerFreq = screenXToMhz(mouseX);

                    // Sensitivity settings
                    const zoomFactor = e.deltaY > 0 ? 0.96 : 1.04;
                    scale = Math.min(
                        Math.max(minZoom, scale * zoomFactor),
                        maxZoom,

                    // Pan logic

                    const tier = getZoomTier(scale);
                    const tierName = Object.keys(zoomTiers).find(
                        (key) => zoomTiers[key] === tier,

                });

            document
                .getElementById("us-domain-visibility")
                .addEventListener("change", (e) => {
                    showUSDomain = e.target.checked;
                });

            document
                .getElementById("eu-domain-visibility")
                .addEventListener("change", (e) => {
                    showEUDomain = e.target.checked;
                });

            document
                .getElementById("au-domain-visibility")
                .addEventListener("change", (e) => {
                    showAUDomain = e.target.checked;
                });

            document
                .getElementById("jp-domain-visibility")
                .addEventListener("change", (e) => {
                    showJPDomain = e.target.checked;
                });

            // Spectral mask height slider

            heightSlider.addEventListener("input", (e) => {
                chartSettings.spectralMaskHeight = parseInt(e.target.value);
            });

            // Select all checkboxes that control visibility
            const visibilityToggles = document.querySelectorAll(
                'input[id$="-visibility"]',
            );

            visibilityToggles.forEach((toggle) => {
                const groupName = toggle.id.replace("-visibility", "");
                const options = document.querySelectorAll(
                    `.${groupName}-options`,
                );

                // Function to update display based on checkbox state
                function updateVisibility() {
                    options.forEach((opt) => {
                        opt.style.display = toggle.checked ? "block" : "none";
                    });
                }

                // Run visiblity check once on page load
                updateVisibility();

                // Run whenever a visibility checkbox is changed
                toggle.addEventListener("change", updateVisibility);
            });

            document.getElementById("export").addEventListener("click", () => {
                const canvas = document.getElementById("canvas");
                const context = canvas.getContext("2d");

                // Save the current canvas state
                context.save();

                // Add white background
                const currentCompositeOperation =
                    context.globalCompositeOperation;
                context.globalCompositeOperation = "destination-over";
                context.fillStyle = style.interface.backgroundColor;
                context.fillRect(0, 0, canvas.width, canvas.height);

                // Convert to data URL
                const dataUrl = canvas.toDataURL("image/png");

                // Restore the canvas state (removes the white background)
                context.globalCompositeOperation = currentCompositeOperation;
                context.restore();

                // Create and trigger download
                const link = document.createElement("a");
                link.download = "canvas-drawing.png";
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });

            document
                .getElementById("900-MHz-shortcut")
                .addEventListener("click", (e) => {
                    setViewportFrequencyRange(900, 930);
                });

            document
                .getElementById("2400-MHz-shortcut")
                .addEventListener("click", (e) => {
                    setViewportFrequencyRange(2395, 2505);
                });

            document
                .getElementById("5000-MHz-shortcut")
                .addEventListener("click", (e) => {
                    setViewportFrequencyRange(5150, 5925);
                });

            document
                .getElementById("6000-MHz-shortcut")
                .addEventListener("click", (e) => {
                    setViewportFrequencyRange(5930, 7140);
                });

            document
                .getElementById("full-spectrum-shortcut")
                .addEventListener("click", (e) => {
                    setViewportFrequencyRange(-300, 11300);
                });

            // Theme selector
            document
                .querySelectorAll('input[name="theme-select"]')
                .forEach((radio) => {
                    radio.addEventListener("change", (e) => {
                        const mode = e.target.value
                            .toLowerCase()
                            .replace(" mode", "");
                        setTheme(
                            mode === "light"
                                ? "light"
                                : mode === "dark"
                                  ? "dark"
                                  : "system",
                        );
                    });
                });

            // Event listener for OS theme changes
            window
                .matchMedia("(prefers-color-scheme: dark)")
                .addEventListener("change", () => {
                    // Check if any "system" radio button is selected
                    const systemRadio = document.querySelector(
                        'input[name="theme-select"][value="system"]',
                    );
                    if (systemRadio && systemRadio.checked) {
                        setTheme("system");
                    }
                });

            canvas.addEventListener("touchstart", (e) => {
                isCoasting = false;
                velocity = 0;

                // Any new touch dismisses the inspector; a tap re-opens it
                // in touchend. Only a lone, non-double-tap touch can be a tap.
                inspectPosition = null;
                tapCandidate = null;

                if (e.touches.length === 2) {
                    // Two fingers - this is a pinch gesture
                    isDragging = false;
                    doubleTapZooming = false;
                    pinchZooming = true;

                    // Handle pinch start as before
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    lastPinchDistance = Math.hypot(
                        touch2.clientX - touch1.clientX,
                        touch2.clientY - touch1.clientY,
                    );
                } else if (e.touches.length === 1) {
                    // Check for double-tap
                    const currentTime = Date.now();
                    const tapDelay = currentTime - lastTapTime;

                    if (tapDelay < 300 && tapDelay > 0) {
                        // Double tap detected
                        e.preventDefault();

                        // Cancel any ongoing drag
                        isDragging = false;

                        // Start double-tap zoom
                        doubleTapZooming = true;
                        pinchZooming = false;
                        doubleTapStartY = e.touches[0].clientY;
                        initialScale = scale;
                        zoomCenterX = e.touches[0].clientX;
                    } else {
                        // Single tap - prepare for potential drag
                        isDragging = true;
                        doubleTapZooming = false;
                        pinchZooming = false;
                        lastPosition = {
                            x: e.touches[0].clientX,
                            y: e.touches[0].clientY,
                        };
                        lastTimestamp = Date.now();
                        tapCandidate = {
                            x: e.touches[0].clientX,
                            y: e.touches[0].clientY,
                            time: currentTime,
                        };
                    }

                    lastTapTime = currentTime;
                }
            });

            canvas.addEventListener("touchmove", (e) => {
                // Track velocity
                const currentTimestamp = Date.now();

                // Moved too far to be a tap
                if (
                    tapCandidate &&
                    Math.hypot(
                        e.touches[0].clientX - tapCandidate.x,
                        e.touches[0].clientY - tapCandidate.y,
                    ) > TAP_MAX_MOVEMENT
                ) {
                    tapCandidate = null;
                }

                if (pinchZooming && e.touches.length === 2) {
                    // Handle pinch zooming
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];

                    // Calculate center of pinch in screen coordinates
                    const pinchCenterX = (touch1.clientX + touch2.clientX) / 2;

                    // Calculate current pinch distance
                    const currentDistance = Math.hypot(
                        touch2.clientX - touch1.clientX,
                        touch2.clientY - touch1.clientY,
                    );

                    if (lastPinchDistance) {
                        // Calculate scale change
                        const scaleChange = currentDistance / lastPinchDistance;

                        // Store the frequency at pinch center before scaling
                        const freqAtPinch = screenXToMhz(pinchCenterX);

                        // Update scale
                        scale *= scaleChange;
                        scale = Math.min(Math.max(minZoom, scale), maxZoom);

                        // Calculate the new x position for the same frequency after scaling
                        const newPinchX = mhzToScreenX(freqAtPinch);

                        // Adjust offset to maintain pinch center
                        offset.x += pinchCenterX - newPinchX;
                    }

                    lastPinchDistance = currentDistance;
                    e.preventDefault();
                } else if (doubleTapZooming && e.touches.length === 1) {
                    // Handle double-tap zoom
                    e.preventDefault();

                    // Calculate vertical distance moved
                    const deltaY = doubleTapStartY - e.touches[0].clientY;

                    // Make zoom behavior more linear
                    let zoomFactor;
                    if (deltaY > 0) {
                        zoomFactor = 1 * (1 + Math.abs(deltaY) / 40);
                    } else {
                        // Zooming out - use linear reduction
                        zoomFactor = 1 / (1 + Math.abs(deltaY) / 40);
                    }

                    // Store the frequency at zoom center before scaling
                    const freqAtZoom = screenXToMhz(zoomCenterX);

                    // Apply zoom
                    const newScale = Math.min(
                        Math.max(minZoom, initialScale * zoomFactor),
                        maxZoom,
                    );

                    if (newScale !== scale) {
                        scale = newScale;

                        // Calculate the new x position for the same frequency after scaling
                        const newZoomX = mhzToScreenX(freqAtZoom);

                        // Adjust offset to maintain zoom center
                        offset.x += zoomCenterX - newZoomX;
                    }
                } else if (isDragging && e.touches.length === 1) {
                    // Handle panning
                    const deltaX = e.touches[0].clientX - lastPosition.x;
                    const deltaTime = currentTimestamp - lastTimestamp;

                    if (deltaTime > 0) {
                        // Update velocity (pixels per millisecond)
                        velocity = deltaX / deltaTime;
                    }

                    offset.x += deltaX;
                    lastPosition.x = e.touches[0].clientX;
                    panVertically(e.touches[0].clientY - lastPosition.y);
                    lastPosition.y = e.touches[0].clientY;
                    e.preventDefault();
                }

                lastTimestamp = currentTimestamp;
            });

            canvas.addEventListener("touchend", (e) => {
                // A quick, nearly stationary single touch is a tap
                if (
                    tapCandidate &&
                    e.touches.length === 0 &&
                    Date.now() - tapCandidate.time < TAP_MAX_DURATION
                ) {
                    inspectPosition = { x: tapCandidate.x, y: tapCandidate.y };
                    inspectFromTouch = true;
                }
                tapCandidate = null;

                isDragging = false;
                doubleTapZooming = false;
                pinchZooming = false;
                lastPinchDistance = null;

                // Only start coasting if there is significant velocity
                if (Math.abs(velocity) > 0.1) {
                    isCoasting = true;
                    coastingAnimation();
                }
            });

            draw();
        </script>
    </body>
</html>
